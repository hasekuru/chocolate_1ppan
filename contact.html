<!DOCTYPE html>
<html lang="Ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="紬ショコラに関するお問い合わせ窓⼝です。商品についてのご質問や取材のご依頼、お取引のご相談など、
    お気軽にご連絡ください。受付時間は平⽇10時から17時までとなっております。">
    <meta property="og:title" content="お問い合わせ｜紬ショコラ">
    <title>お問い合わせ｜紬ショコラ</title>

    <!-- CSSリセット -->
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho&family=Noto+Sans+JP:wght@100..900&family=Shippori+Mincho&display=swap" rel="stylesheet">

    <!-- 共通スタイル -->
    <link rel="stylesheet" href="./css/style.css">

</head>
<body>
    <main>
        <section class="page-title">
            <div>
                <h1 class="headline">お問い合わせ</h1>
                <p>商品に関するご質問や、取材‧お取引のご相談など、お気軽にお問い合わせください。
                    内容を確認のうえ、担当より折り返しご連絡いたします。</p>
            </div>
        </section>
        
        <section class="contact-info">
            <div>
                <h3>連絡先</h3>
                <table class="contact-table">
                    <tr>
                        <th>社名</th>
                        <td>【会社名】</td>
                    </tr>
                    <tr>
                        <th>電話</th>
                        <td>【電話番号】</td>
                    </tr>
                    <tr>
                        <th>メール</th>
                        <td>【メールアドレス】</td>
                    </tr>
                    <tr>
                        <th>受付時間</th>
                        <td>【受付時間】</td>
                    </tr>
                </table>
            </div>
        </section>

        <section class="contact-form">
            <div>
                <form action="" method="post" name="contact-form">
                    <p>お名前<span class="required">＊必須</span></p>
                    <input type="text" minlength="2"
                    placeholder="" required><br>

                    <p>メールアドレス<span class="required">＊必須</span> </p>
                    <input type="email" required><br>

                    <p>お問い合わせ内容<span class="required">＊必須</span></p>
                    <textarea name="message" required></textarea><br>
                    
                    <input type="submit" value="送信">
                </form>
            </div>
        </section>
    </main>
</body>
</html>
